[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codetruth"
version = "0.4.0"
description = "A verification layer that lets AI agents safely delete code in large codebases"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alaik Asif Sheik" }]
keywords = ["dead-code", "static-analysis", "ai-agents", "mcp", "deletion-safety"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "networkx>=3.0",
    "PyYAML>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]
# The core stays deliberately lean (no web-server stack) so CLI / CI /
# library use is lightweight. The MCP server is an extra: `codetruth[mcp]`.

[project.urls]
Homepage = "https://github.com/AlaikAsif/CodeTruth"
Repository = "https://github.com/AlaikAsif/CodeTruth"
Issues = "https://github.com/AlaikAsif/CodeTruth/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.2"]                 # the agent-facing MCP server
javascript = ["tree-sitter>=0.21", "tree-sitter-language-pack>=0.6"]
all = ["mcp>=1.2", "tree-sitter>=0.21", "tree-sitter-language-pack>=0.6"]
dev = ["pytest>=7.0", "tree-sitter>=0.21", "tree-sitter-language-pack>=0.6"]

[project.scripts]
codetruth = "codetruth.cli:main"

[tool.setuptools.packages.find]
include = ["codetruth*"]

[tool.setuptools.package-data]
codetruth = ["rules/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
