[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codetruth"
version = "0.1.0"
description = "A verification layer that lets AI agents safely delete code in large codebases"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "networkx>=3.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=7.0"]

[project.scripts]
codetruth = "codetruth.cli:main"

[tool.setuptools.packages.find]
include = ["codetruth*"]

[tool.setuptools.package-data]
codetruth = ["rules/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
