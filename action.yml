name: "CodeTruth Dead Code Gate"
description: "Fails builds on newly-introduced provably-dead code; uploads SARIF PR annotations. Advisory - never edits code."
author: "AlaikAsif"
branding:
  icon: "search"
  color: "purple"

inputs:
  path:
    description: "Repository path to scan"
    default: "."
  language:
    description: "python | javascript | typescript"
    default: "python"
  args:
    description: "Extra `codetruth scan` arguments (e.g. --app-mode --strict)"
    default: ""
  upload-sarif:
    description: "Upload SARIF to GitHub Code Scanning (needs security-events: write)"
    default: "true"
  version:
    description: "codetruth version to install (PyPI specifier)"
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install codetruth
      shell: bash
      run: |
        SPEC="codetruth${{ inputs.version && format('=={0}', inputs.version) || '' }}"
        if [ "${{ inputs.language }}" != "python" ]; then
          python -m pip install --quiet "${SPEC}" "codetruth[javascript]"
        else
          python -m pip install --quiet "${SPEC}"
        fi

    - name: Scan (CI gate + SARIF)
      id: scan
      shell: bash
      run: |
        set +e
        codetruth scan "${{ inputs.path }}" \
          --language "${{ inputs.language }}" \
          --ci --no-progress \
          --sarif codetruth.sarif \
          ${{ inputs.args }}
        echo "exit=$?" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: codetruth.sarif
      continue-on-error: true

    - name: Enforce gate
      shell: bash
      run: |
        if [ "${{ steps.scan.outputs.exit }}" != "0" ]; then
          echo "::error::CodeTruth found newly-introduced provably-dead code."
          echo "Accept the current state with 'codetruth baseline .' (commit"
          echo "the baseline file), mark false alarms with '# codetruth: keep'"
          echo "or a .codetruth.toml entrypoint, or remove the dead code."
          exit 1
        fi
